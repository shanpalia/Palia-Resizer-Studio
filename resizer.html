/* Full-frame illustration with the drop instruction layered above it. */
.batch-main .resizer-hero>.upload-compact #batchUploadZone.batch-upload-zone{position:relative!important;isolation:isolate;height:360px!important;min-height:360px!important;max-height:none!important;box-sizing:border-box!important;display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;gap:14px!important;text-align:center!important;padding:24px!important;background:#f3fcf7!important;border:1.5px dashed #a9d9bd!important;border-radius:13px!important;overflow:hidden!important;cursor:pointer!important}
.batch-main .resizer-hero>.upload-compact #batchUploadZone .batch-upload-icon{position:absolute!important;inset:0!important;z-index:-1!important;display:block!important;width:100%!important;height:100%!important;flex:none!important;margin:0!important;padding:0!important;border:0!important;border-radius:0!important;background:transparent!important;box-shadow:none!important;opacity:.62!important;pointer-events:none!important}
.batch-main .resizer-hero>.upload-compact #batchUploadZone .batch-upload-icon:before,.batch-main .resizer-hero>.upload-compact #batchUploadZone .batch-upload-icon:after{content:none!important;display:none!important}
.batch-main .resizer-hero>.upload-compact #batchUploadZone .batch-upload-icon img{display:block!important;width:100%!important;height:100%!important;object-fit:cover!important;object-position:center!important}
.batch-main .resizer-hero>.upload-compact #batchUploadZone .upload-copy{position:relative!important;z-index:1!important;display:block!important;flex:0 1 auto!important;min-width:0!important;text-align:center!important;padding:16px 24px!important;border:1px solid #c5e8d4!important;border-radius:16px!important;background:rgba(255,255,255,.88)!important;box-shadow:0 8px 28px rgba(31,105,72,.10)!important;backdrop-filter:blur(5px)!important;cursor:pointer!important}
.batch-main .resizer-hero>.upload-compact #batchUploadZone .upload-copy strong{display:block!important;font-size:20px!important;letter-spacing:.2px!important;color:#173c2c!important;cursor:pointer!important}
.batch-main .resizer-hero>.upload-compact #batchUploadZone .upload-copy small{display:block!important;font-size:12px!important;color:#607b6c!important;margin-top:7px!important;cursor:pointer!important}
.batch-main .resizer-hero>.upload-compact #browseImages{display:inline-flex!important;cursor:pointer!important}
.batch-page .batch-main *{cursor:auto}
.batch-page .batch-main button,.batch-page .batch-main a,.batch-page .batch-main [role="button"],.batch-page .batch-main input[type="button"],.batch-page .batch-main input[type="submit"],.batch-page .batch-main input[type="range"],.batch-page .batch-main input[type="checkbox"],.batch-page .batch-main label,.batch-page .batch-main select{cursor:pointer}
.batch-page .batch-main input[type="text"],.batch-page .batch-main input[type="number"],.batch-page .batch-main textarea{cursor:text}
.batch-main .batch-results{scroll-margin-top:18px}
@media(max-width:600px){.batch-main .resizer-hero>.upload-compact #batchUploadZone.batch-upload-zone{height:300px!important;min-height:300px!important;padding:18px!important}.batch-main .resizer-hero>.upload-compact #batchUploadZone .upload-copy strong{font-size:17px!important}}

<body class="editor-body batch-page"><header class="topbar"><a class="brand" href="./"><span class="brand-mark">P</span><span><strong>Palia Resizer Studio</strong><small>BY PALIAAPK HUB</small></span></a><nav><a href="./#tools">All tools</a><a class="nav-cta" href="tools.html">Crop & Other Tools ↗</a></nav></header>
<main class="batch-main"><section class="resizer-hero"><div class="hero-brand-line"><a class="back-link" href="./">← Home</a></div><div class="batch-title"><span class="eyebrow">MULTI-IMAGE WORKFLOW</span><h1>Image <em>Resizer</em></h1><p>Resize and compress your photos in one place. Add multiple images, choose a target size in KB, then convert and download individually.</p><div class="hero-trust"><span>✓ No account needed</span><span>✓ Files stay on your device</span><span>✓ Convert one by one</span></div></div><section class="upload-compact"><input id="batchFilesInput" type="file" accept="image/*" multiple hidden><div id="batchUploadZone" class="batch-upload-zone" tabindex="0" role="button" aria-label="Drag and drop multiple images or click to choose"><span class="batch-upload-icon" aria-hidden="true"><img src="assets/upload-frame-art.svg?v=20261020-1" alt="" /></span><div class="upload-copy"><strong>Drag & drop images here</strong><small>JPG, PNG, WebP · कई फोटो एक साथ</small></div></div><button type="button" id="browseImages" class="button primary">Choose image</button><div class="upload-meta"><span id="batchCount">0 images selected</span><button id="clearBatch" class="text-button" type="button" disabled>Clear all</button></div></section></section>

<section class="batch-settings"><div class="settings-title"><span class="eyebrow">OUTPUT SETTINGS</span><h2>Target file size (KB)</h2><p>Choose a target size in KB. After conversion, download the image from its row below.</p><p id="batchTargetHelp" class="kb-note">Each image will be compressed toward 100 KB. The final size depends on image detail and format.</p></div><div class="batch-setting-grid"><label>Target size<select id="batchTargetPreset"><option value="20">20 KB</option><option value="50">50 KB</option><option value="100" selected>100 KB</option><option value="200">200 KB</option><option value="500">500 KB</option><option value="custom">Custom KB</option><option value="0">Best quality</option></select></label><label>Custom size (KB)<input id="batchTargetKB" type="number" min="1" max="20000" value="100" inputmode="numeric"></label><label>Output format<select id="batchFormat"><option value="image/jpeg">JPG</option><option value="image/webp">WebP</option><option value="image/png">PNG</option></select></label><label class="batch-quality">Quality <strong id="batchQualityValue">85%</strong><input id="batchQuality" type="range" min="10" max="100" value="85"></label></div><p class="kb-note">KB size is best-effort: complex images and PNG files may not reach the exact target.</p></section>
<section class="batch-results"><div class="results-heading"><div><span class="eyebrow">YOUR IMAGES</span><h2>Convert & download one by one</h2></div><span id="batchProgress" class="batch-progress">Waiting for images</span></div><div id="batchImageList" class="batch-image-list"><div class="batch-empty-state"><span>▧</span><strong>Your images will appear here</strong><small>Drag & drop images here or choose an image above.</small></div></div></section>
